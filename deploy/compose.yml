name: aicfes

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  postgres:
    # pgvector, not plain postgres: the near-duplicate check runs as a
    # cosine comparison in the database, and the migration creates the
    # extension.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: aicfes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: aicfes
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aicfes -d aicfes']
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 384m
    logging: *logging
    # Never on the edge network: the database is reachable only from the API.
    networks: [internal]

  api:
    image: ghcr.io/diegowritescode/aicfes-api:${AICFES_API_TAG:?set AICFES_API_TAG in deploy/.env}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://aicfes:${POSTGRES_PASSWORD}@postgres:5432/aicfes?schema=public
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/.env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY in deploy/.env}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      CORS_ORIGIN: https://${WEB_HOST:?set WEB_HOST in deploy/.env}
      NODE_ENV: production
      PORT: 3000
      # Daily spend caps, in dollars. Unset means the code's defaults.
      # This block lists every variable the service sees, so a setting
      # written only in .env never reaches the container — which is how
      # a seeding account silently ran under the free cap and stopped
      # after thirty items.
      CUOTA_DIARIA_GRATIS_USD: ${CUOTA_DIARIA_GRATIS_USD:-}
      # The paid cap was missing here while `pago` existed only as a
      # type. Now that User.plan is a column, a paying learner would
      # have silently got whatever the code defaults to.
      CUOTA_DIARIA_PAGO_USD: ${CUOTA_DIARIA_PAGO_USD:-}
      CUOTA_DIARIA_SEMILLA_USD: ${CUOTA_DIARIA_SEMILLA_USD:-}
      # Accounts allowed to stock the bank. Empty unless deliberately set.
      USUARIOS_SEMILLA: ${USUARIOS_SEMILLA:-}
      # Opens the moderation queue. Absent means the queue is closed to
      # everyone, which is deliberate: open-when-unset would leak a
      # queue of minors' reports the first time someone deploys without
      # it, and silently. Declared here because compose does not pass
      # `.env` into a container on its own — a secret in `.env` and not
      # in this list reaches nothing, which is exactly how this was
      # first deployed.
      MODERACION_TOKEN: ${MODERACION_TOKEN:-}
      # Tells whoever moderates that a report arrived. Both optional:
      # without them nothing is sent, the report is still saved and the
      # queue is still readable in the app.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MODERACION_CORREO: ${MODERACION_CORREO:-}
      CORREO_REMITENTE: ${CORREO_REMITENTE:-}
    healthcheck:
      test:
        - CMD-SHELL
        - 'node -e "fetch(''http://127.0.0.1:3000/api/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"'
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    logging: *logging
    networks: [edge, internal]
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge
      - traefik.http.routers.aicfes-api.rule=Host(`${API_HOST:?set API_HOST in deploy/.env}`)
      - traefik.http.routers.aicfes-api.entrypoints=websecure
      - traefik.http.routers.aicfes-api.tls.certresolver=le
      - traefik.http.services.aicfes-api.loadbalancer.server.port=3000

  web:
    image: ghcr.io/diegowritescode/aicfes-web:${AICFES_WEB_TAG:?set AICFES_WEB_TAG in deploy/.env}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    logging: *logging
    networks: [edge]
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge
      - traefik.http.routers.aicfes-web.rule=Host(`${WEB_HOST}`)
      - traefik.http.routers.aicfes-web.entrypoints=websecure
      - traefik.http.routers.aicfes-web.tls.certresolver=le
      - traefik.http.services.aicfes-web.loadbalancer.server.port=8080

volumes:
  pgdata:

networks:
  edge:
    external: true
    name: edge
  internal:
