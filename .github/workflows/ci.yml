name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aicfes
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: aicfes
        options: >-
          --health-cmd "pg_isready -U aicfes -d aicfes"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports: ['5432:5432']

    env:
      DATABASE_URL: postgresql://aicfes:ci@localhost:5432/aicfes?schema=public
      JWT_SECRET: ci-secret
      OPENAI_API_KEY: sk-not-used-in-ci

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npm run build

      # The schema has to reproduce itself from the migrations alone: this
      # is what was broken before, so it is checked on every push.
      - name: Migrations build the schema from scratch
        run: npx prisma migrate deploy

      - name: Migrations match the schema
        run: |
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$DATABASE_URL" \
            --exit-code && echo "no drift"

      - run: npm test

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
